# Repo-managed Herdr configuration.
# Live path on macOS: ~/.config/herdr/config.toml

onboarding = false

[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+b"
toggle_sidebar = "prefix+b"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
close_pane = "prefix+x"
zoom = "prefix+z"
reload_config = "prefix+shift+r"

# reviewr.toggle: toggle the review pane in the current workspace.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

# reviewr.open-tab: create a dedicated tab and launch reviewr in it.
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = 'herdr plugin pane open --plugin persiyanov.reviewr --entrypoint pane --placement tab --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --focus'
description = "open reviewr tab"

[ui]
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 40
sidebar_collapsed_mode = "compact"
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_scrollbars = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
agent_panel_sort = "priority"

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab"], ["agent", "state_text"]]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 50000000
